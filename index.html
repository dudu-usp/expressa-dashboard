<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Expressa · Cuidador</title>
<!--
  Painel do cuidador: assina os tópicos MQTT que o ESP (ou a placa virtual)
  publica. Abra este arquivo no navegador. Broker e prefixo dos tópicos podem
  mudar em "Configurações" ou na URL: index.html?prefixo=...&broker=wss://...
  Tópicos: PREFIXO/status, PREFIXO/ao_vivo, PREFIXO/mensagem (modelo/mqtt_expressa.py)
-->
<script src="vocab.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f4f8; --card: #ffffff; --texto: #0b0b0b; --texto-2: #52514e; --apagado: #898781;
    --borda: #e1e0d9; --acento: #6c63ff;
    --ok: #0ca30c; --alerta: #d03b3b;
    --raio: 16px; --sombra: 0 2px 14px rgba(30, 42, 74, 0.08);
    --fonte: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121212; --card: #1a1a19; --texto: #f0efec; --texto-2: #c3c2b7; --apagado: #898781;
      --borda: #2c2c2a; --sombra: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212; --card: #1a1a19; --texto: #f0efec; --texto-2: #c3c2b7; --apagado: #898781;
    --borda: #2c2c2a; --sombra: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--fonte); background: var(--bg); color: var(--texto); line-height: 1.4; }
  .pagina { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px;
            grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  @media (max-width: 820px) { .pagina { grid-template-columns: minmax(0, 1fr); } }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
  h1 span { color: var(--acento); }
  h2 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--texto-2); margin-bottom: 12px; }
  .cartao { background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); padding: 18px; min-width: 0; }
  .coluna { display: grid; gap: 16px; align-content: start; min-width: 0; }

  .estado { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--texto-2);
            padding: 6px 12px; border-radius: 99px; border: 1px solid var(--borda); background: var(--card); }
  .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--apagado); }
  .estado.online .ponto { background: var(--ok); }
  .estado.offline .ponto { background: var(--alerta); }

  /* última mensagem */
  .ultima { border-left: 8px solid var(--cor-nivel, var(--borda)); }
  .ultima.urgente { animation: pulsa 1.2s ease-in-out infinite; }
  @keyframes pulsa { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--cor-nivel) 35%, transparent); } }
  .frase { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin: 4px 0 12px; overflow-wrap: anywhere; }
  .simbolos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px;
          background: var(--bg); font-weight: 700; font-size: 15px; }
  .chip .emoji { font-size: 22px; }
  .linha-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--texto-2); font-size: 14px; }
  .nivel { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--texto);
           padding: 4px 12px 4px 8px; border-radius: 99px; background: var(--bg); white-space: nowrap; }
  .nivel::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--cor-nivel); }
  .vazio-msg { color: var(--apagado); font-size: 15px; }
  .btn { font: inherit; font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 10px; cursor: pointer;
         border: 1px solid var(--borda); background: var(--card); color: var(--texto); }
  .btn.primario { background: var(--alerta); border-color: var(--alerta); color: #fff; }

  /* agora */
  .agora-titulo { font-weight: 700; margin-bottom: 10px; }
  .mini-cartoes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .mini { border: 1px solid var(--borda); border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 700; }
  .mini .emoji { display: block; font-size: 24px; }
  .mini.vazio { border-style: dashed; color: var(--apagado); }
  .niveis-agora { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .nivel-seg { border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 700;
               border: 1px solid var(--borda); border-top: 5px solid var(--cor-nivel); opacity: .45; }
  .nivel-seg.atual { opacity: 1; border-color: var(--cor-nivel); }

  /* hoje */
  .blocos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .bloco .valor { font-size: 28px; font-weight: 800; }
  .bloco .rotulo { font-size: 12px; color: var(--texto-2); font-weight: 600; }
  .barras { display: grid; gap: 8px; }
  .barra { display: grid; grid-template-columns: 120px minmax(0, 1fr) 28px; align-items: center; gap: 8px; font-size: 13px; }
  .barra .nome { font-weight: 700; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra .trilho { height: 12px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .barra .cheio { height: 100%; background: var(--cor-nivel); border-radius: 0 4px 4px 0; min-width: 0; }
  .barra .conta { text-align: right; font-weight: 700; }

  /* histórico */
  .historico { list-style: none; display: grid; gap: 2px; max-height: 420px; overflow-y: auto; }
  .historico li { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center;
                  padding: 8px 4px; border-bottom: 1px solid var(--borda); font-size: 15px; }
  .historico .hora { color: var(--texto-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .historico .texto { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rodape-cartao { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; flex-wrap: wrap; }

  details summary { cursor: pointer; font-weight: 700; color: var(--texto-2); font-size: 14px; }
  .config { display: grid; gap: 8px; margin-top: 12px; }
  .config label { font-size: 13px; font-weight: 600; color: var(--texto-2); display: grid; gap: 4px; }
  .config input[type=text] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--borda);
                             background: var(--bg); color: var(--texto); width: 100%; }
  .config .linha { display: flex; align-items: center; gap: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="pagina">

  <header>
    <h1><span>✦</span> Expressa · Cuidador</h1>
    <div id="estado" class="estado"><span class="ponto"></span><span id="estado-texto">conectando ao broker…</span></div>
  </header>

  <div class="coluna">
    <section id="ultima" class="cartao ultima" aria-live="polite">
      <h2>Última mensagem</h2>
      <div id="ultima-corpo"><p class="vazio-msg">Nenhuma mensagem ainda.</p></div>
    </section>

    <section class="cartao">
      <h2>Histórico</h2>
      <ul id="historico" class="historico"></ul>
      <div class="rodape-cartao">
        <span id="historico-total" class="vazio-msg"></span>
        <button id="limpar" class="btn">Limpar histórico</button>
      </div>
    </section>
  </div>

  <div class="coluna">
    <section class="cartao">
      <h2>Agora</h2>
      <div id="agora"><p class="vazio-msg">Aguardando o Expressa.</p></div>
    </section>

    <section class="cartao">
      <h2>Hoje</h2>
      <div class="blocos">
        <div class="bloco"><div id="hoje-total" class="valor">0</div><div class="rotulo">mensagens</div></div>
        <div class="bloco"><div id="hoje-urgentes" class="valor">0</div><div class="rotulo">urgentes (3 ou 4)</div></div>
        <div class="bloco"><div id="hoje-tempo" class="valor">–</div><div class="rotulo">tempo médio para montar</div></div>
      </div>
      <div id="barras" class="barras" role="table" aria-label="Mensagens de hoje por nível"></div>
    </section>

    <section class="cartao">
      <details>
        <summary>Configurações</summary>
        <div class="config">
          <label>Broker (WebSocket)<input id="cfg-broker" type="text"/></label>
          <label>Prefixo dos tópicos<input id="cfg-prefixo" type="text"/></label>
          <div class="linha"><input id="cfg-som" type="checkbox"/><label for="cfg-som">Som quando chegar mensagem urgente</label></div>
          <div><button id="cfg-salvar" class="btn">Salvar e reconectar</button></div>
        </div>
      </details>
    </section>
  </div>

</div>

<script>
'use strict';

// ── Configuração (URL > preferências salvas > padrão) ─────────────────────
const PADRAO = { broker: 'wss://broker.hivemq.com:8884/mqtt', prefixo: 'labdig/t5bb6/expressa', som: true };
const FIM = 4, VAZIO = 63;
const MAX_HISTORICO = 200;

function lerLocal(chave, padrao) {
  try { const v = localStorage.getItem(chave); return v === null ? padrao : JSON.parse(v); } catch (e) { return padrao; }
}
function gravarLocal(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) { /* sem armazenamento: tudo bem */ }
}

const params = new URLSearchParams(location.search);
const cfg = { ...PADRAO, ...lerLocal('expressa-config', {}) };
if (params.get('broker')) cfg.broker = params.get('broker');
if (params.get('prefixo')) cfg.prefixo = params.get('prefixo');

// ── Vocabulário ──────────────────────────────────────────────────────────
const SIMBOLOS = Object.fromEntries(VOCAB.simbolos.map((s) => [s.indice, s]));
const NIVEIS = Object.fromEntries(VOCAB.niveis.map((n) => [n.nivel, n]));
const nivelInfo = (n) => NIVEIS[n] || NIVEIS[0];

function textoFrase(ids) {
  const t = ids.filter((i) => i !== FIM && SIMBOLOS[i]).map((i) => SIMBOLOS[i].palavra).join(' ');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ── Estado ───────────────────────────────────────────────────────────────
const estado = {
  conexao: 'conectando',   // conectando | conectado | erro
  online: null,            // status publicado pelo ESP
  aoVivo: null,
  historico: lerLocal('expressa-historico', []),   // mais recente primeiro
  ciente: true,            // o cuidador já viu a última mensagem urgente
};

function chave(m) { return `${m.seq}|${m.frase.join(',')}|${m.nivel}|${m.duracao_s}`; }

function trataMensagem(topico, texto, retida) {
  const tipo = topico.slice(cfg.prefixo.length + 1);
  if (tipo === 'status') {
    estado.online = texto === 'online';
  } else if (tipo === 'ao_vivo') {
    try { estado.aoVivo = { ...JSON.parse(texto), quando: Date.now() }; } catch (e) { return; }
  } else if (tipo === 'mensagem') {
    let m;
    try { m = JSON.parse(texto); } catch (e) { return; }
    if (!m || !Array.isArray(m.frase)) return;
    // a mensagem retida chega de novo a cada conexão: não duplica no histórico
    if (estado.historico.length && chave(estado.historico[0]) === chave(m)) return;
    m.quando = retida ? null : Date.now();
    estado.historico.unshift(m);
    estado.historico.length = Math.min(estado.historico.length, MAX_HISTORICO);
    gravarLocal('expressa-historico', estado.historico);
    if (!retida) {
      estado.aoVivo = { tipo: 'enviada', quando: Date.now() };
      if (m.nivel >= 3) { estado.ciente = false; if (cfg.som) apita(); }
    }
  }
  render();
}

// ── Alerta sonoro (sem arquivo de áudio) ─────────────────────────────────
let audio = null;
function apita() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach((t) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.15);
    });
  } catch (e) { /* navegador sem áudio */ }
}

// ── Desenho ──────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);

function quandoTexto(ms) {
  if (ms === null || ms === undefined) return 'antes de abrir o painel';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'agora há pouco';
  if (s < 3600) return `há ${Math.round(s / 60)} min`;
  return new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function pillNivel(n) {
  const i = nivelInfo(n);
  return `<span class="nivel" style="--cor-nivel:${i.cor}">${n ? `${n} · ` : ''}${esc(i.nome)}</span>`;
}

function renderEstado() {
  const el = $('estado'), texto = $('estado-texto');
  el.className = 'estado';
  if (estado.conexao !== 'conectado') {
    texto.textContent = estado.conexao === 'erro' ? 'sem conexão com o broker' : 'conectando ao broker…';
  } else if (estado.online === null) {
    texto.textContent = 'aguardando o Expressa';
  } else {
    el.classList.add(estado.online ? 'online' : 'offline');
    texto.textContent = estado.online ? 'Expressa conectado' : 'Expressa desconectado';
  }
}

function renderUltima() {
  const m = estado.historico[0];
  const sec = $('ultima');
  if (!m) { sec.classList.remove('urgente'); return; }
  const info = nivelInfo(m.nivel);
  sec.style.setProperty('--cor-nivel', info.cor);
  sec.classList.toggle('urgente', m.nivel >= 3 && !estado.ciente);
  const chips = m.frase.filter((i) => i !== FIM && SIMBOLOS[i])
    .map((i) => `<span class="chip"><span class="emoji">${SIMBOLOS[i].emoji}</span>${esc(SIMBOLOS[i].nome)}</span>`).join('');
  const tempo = m.duracao_s === null || m.duracao_s === undefined ? '' : ` · montada em ${Math.round(m.duracao_s)} s`;
  $('ultima-corpo').innerHTML = `
    <p class="frase">${esc(textoFrase(m.frase))}</p>
    <div class="simbolos">${chips}</div>
    <div class="linha-meta">${pillNivel(m.nivel)}<span>${quandoTexto(m.quando)}${tempo}</span>
      ${m.nivel >= 3 && !estado.ciente ? '<button id="ciente" class="btn primario">Ciente</button>' : ''}</div>`;
  const b = $('ciente');
  if (b) b.addEventListener('click', () => { estado.ciente = true; render(); });
}

function miniCartao(i) {
  if (i === VAZIO || !SIMBOLOS[i]) return '<div class="mini vazio"><span class="emoji">·</span>vazio</div>';
  return `<div class="mini"><span class="emoji">${SIMBOLOS[i].emoji}</span>${esc(SIMBOLOS[i].nome)}</div>`;
}

function renderAgora() {
  const a = estado.aoVivo, el = $('agora');
  if (!a) { el.innerHTML = '<p class="vazio-msg">Aguardando o Expressa.</p>'; return; }
  if (a.tipo === 'rodada') {
    el.innerHTML = `<p class="agora-titulo">Escolhendo a ${a.numero}ª palavra</p>
      <div class="mini-cartoes">${a.simbolos.map(miniCartao).join('')}</div>`;
  } else if (a.tipo === 'nivel_vez') {
    const segs = VOCAB.niveis.filter((n) => n.nivel > 0).map((n) =>
      `<div class="nivel-seg${n.nivel === a.nivel ? ' atual' : ''}" style="--cor-nivel:${n.cor}">${n.nivel}<br/>${esc(n.nome)}</div>`).join('');
    el.innerHTML = `<p class="agora-titulo">Escolhendo a urgência (servo no nível ${a.nivel})</p><div class="niveis-agora">${segs}</div>`;
  } else if (a.tipo === 'enviada') {
    el.innerHTML = '<p class="agora-titulo">Frase enviada ✓</p>';
  } else if (a.tipo === 'perfil') {
    el.innerHTML = '<p class="agora-titulo">Perfil carregado na placa ✓</p>';
  } else {
    el.innerHTML = '<p class="agora-titulo">Pronto para começar uma frase</p>';
  }
}

function renderHoje() {
  const inicioDia = new Date(); inicioDia.setHours(0, 0, 0, 0);
  const hoje = estado.historico.filter((m) => m.quando && m.quando >= inicioDia.getTime());
  $('hoje-total').textContent = hoje.length;
  $('hoje-urgentes').textContent = hoje.filter((m) => m.nivel >= 3).length;
  const tempos = hoje.map((m) => m.duracao_s).filter((t) => typeof t === 'number');
  $('hoje-tempo').textContent = tempos.length ? `${Math.round(tempos.reduce((a, b) => a + b, 0) / tempos.length)} s` : '–';
  const porNivel = [1, 2, 3, 4, 0].map((n) => [n, hoje.filter((m) => m.nivel === n).length]);
  const max = Math.max(1, ...porNivel.map(([, c]) => c));
  $('barras').innerHTML = porNivel.map(([n, c]) => {
    const i = nivelInfo(n);
    return `<div class="barra" role="row" style="--cor-nivel:${i.cor}">
      <span class="nome" role="cell">${n ? `${n} · ` : ''}${esc(i.nome)}</span>
      <span class="trilho"><span class="cheio" style="display:block;width:${(100 * c) / max}%"></span></span>
      <span class="conta" role="cell">${c}</span></div>`;
  }).join('');
}

function renderHistorico() {
  $('historico').innerHTML = estado.historico.slice(0, 100).map((m) => {
    const hora = m.quando ? new Date(m.quando).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
    return `<li><span class="hora">${hora}</span><span class="texto">${esc(textoFrase(m.frase))}</span>${pillNivel(m.nivel)}</li>`;
  }).join('') || '<li><span></span><span class="vazio-msg">Vazio.</span><span></span></li>';
  $('historico-total').textContent = estado.historico.length ? `${estado.historico.length} mensagens guardadas neste navegador` : '';
}

function render() { renderEstado(); renderUltima(); renderAgora(); renderHoje(); renderHistorico(); }

// ── MQTT ─────────────────────────────────────────────────────────────────
let cliente = null;
function conecta() {
  if (cliente) cliente.end(true);
  estado.conexao = 'conectando'; estado.online = null; render();
  cliente = mqtt.connect(cfg.broker, { clientId: `expressa-painel-${Math.random().toString(16).slice(2, 10)}`, reconnectPeriod: 3000 });
  cliente.on('connect', () => {
    estado.conexao = 'conectado'; render();
    cliente.subscribe(`${cfg.prefixo}/#`, { qos: 1 });
  });
  cliente.on('message', (topico, payload, pacote) => trataMensagem(topico, payload.toString(), pacote.retain));
  cliente.on('error', () => { estado.conexao = 'erro'; render(); });
  cliente.on('offline', () => { estado.conexao = 'erro'; render(); });
}

// ── Configurações ────────────────────────────────────────────────────────
$('cfg-broker').value = cfg.broker;
$('cfg-prefixo').value = cfg.prefixo;
$('cfg-som').checked = cfg.som;
$('cfg-salvar').addEventListener('click', () => {
  cfg.broker = $('cfg-broker').value.trim() || PADRAO.broker;
  cfg.prefixo = $('cfg-prefixo').value.trim().replace(/\/+$/, '') || PADRAO.prefixo;
  cfg.som = $('cfg-som').checked;
  gravarLocal('expressa-config', { broker: cfg.broker, prefixo: cfg.prefixo, som: cfg.som });
  conecta();
});
$('limpar').addEventListener('click', () => {
  if (!confirm('Apagar o histórico guardado neste navegador?')) return;
  estado.historico = []; gravarLocal('expressa-historico', []); render();
});

setInterval(renderUltima, 30000);  // atualiza o "há X min"
render();
if (window.mqtt) conecta(); else { estado.conexao = 'erro'; render(); }
</script>
</body>
</html>
